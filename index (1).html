<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vathala Originals - Maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, #0d78c9 0%, transparent 35%),
        linear-gradient(135deg, #031525, #064b80, #020b14);
      color: white;
    }

    .background-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(0, 174, 255, 0.18);
      filter: blur(100px);
      top: -150px;
      right: -120px;
    }

    .card {
      position: relative;
      width: 90%;
      max-width: 520px;
      padding: 42px 30px;
      text-align: center;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.4),
        0 0 50px rgba(0, 150, 255, 0.08);

      animation: fadeIn 1s ease;
    }

    /* BRAND */
    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 5px;
      margin-bottom: 25px;
    }

    .brand span {
      color: #45bcff;
    }

    /* MAINTENANCE IMAGE */
    .maintenance-image {
      width: 145px;
      height: 145px;
      object-fit: contain;
      display: block;
      margin: 0 auto 20px;

      filter: drop-shadow(0 0 25px rgba(40, 180, 255, 0.45));

      animation: floating 3s ease-in-out infinite;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    h1 span {
      color: #46bdff;
    }

    h2 {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 400;
      color: #dceeff;
    }

    .description {
      margin: 18px auto 25px;
      max-width: 420px;
      line-height: 1.7;
      color: #bfd3e4;
      font-size: 14px;
    }

    /* LOADER */
    .loader {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.13);
      border-radius: 20px;
      overflow: hidden;
    }

    .loader-bar {
      width: 40%;
      height: 100%;
      border-radius: 20px;

      background: linear-gradient(
        90deg,
        #087bd1,
        #48c3ff,
        #ffffff
      );

      animation: loading 2s infinite ease-in-out;
    }

    .status {
      margin-top: 15px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #4fc4ff;
    }

    /* VALUES */
    .values {
      margin-top: 25px;
      font-size: 12px;
      letter-spacing: 2px;
      color: white;
      opacity: 0.85;
    }

    .footer {
      margin-top: 25px;
      color: #8fa8bb;
      font-size: 11px;
      line-height: 1.6;
    }

    /* ANIMATIONS */
    @keyframes loading {
      0% {
        transform: translateX(-150%);
      }

      100% {
        transform: translateX(320%);
      }
    }

    @keyframes floating {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* MOBILE */
    @media (max-width: 480px) {

      .card {
        padding: 35px 22px;
      }

      .brand {
        font-size: 15px;
        letter-spacing: 4px;
      }

      .maintenance-image {
        width: 120px;
        height: 120px;
      }

      h1 {
        font-size: 25px;
      }

      h2 {
        font-size: 16px;
      }

      .description {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="background-glow"></div>

  <div class="card">

    <div class="brand">
      VATHALA <span>ORIGINALS</span>
    </div>

    <!-- Maintenance Image -->
    <img
      src="6900592.png"
      alt="Vathala Originals Maintenance"
      class="maintenance-image"
    >

    <h1>
      UNDER <span>MAINTENANCE</span>
    </h1>

    <h2>
      We'll be back soon.
    </h2>

    <p class="description">
      Vathala Originals is currently undergoing
      maintenance and improvements.
      Please check back again soon.
    </p>

    <div class="loader">
      <div class="loader-bar"></div>
    </div>

    <div class="status">
      SYSTEM UPDATE IN PROGRESS...
    </div>

    <div class="values">
      UNITY • LOYALTY • RESPECT
    </div>

    <div class="footer">
      Thank you for your patience and support.
      <br>
      © 2026 Vathala Originals
    </div>

  </div>

</body>
</html>
